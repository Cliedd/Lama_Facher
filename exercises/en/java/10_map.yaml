id: java_10_map
title: Count word occurrences
language: java
difficulty: Intermediate
chapter: 04 · Concrete cases
lesson: A HashMap associates keys with values; getOrDefault handles missing keys.
description: Count each word and print the count for rust.
tip: Use the word as the key, not a separate counter per word.
template: "import java.util.HashMap;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        String[] words = {\"java\", \"rust\", \"rust\", \"java\", \"rust\"};\n\
  \        HashMap<String, Integer> counts = new HashMap<>();\n        // TODO: Count every\
  \ word.\n        System.out.println(counts.getOrDefault(\"rust\", 0));\n    }\n}\n"
expected_output: '3'
hints:
- Loop over words and read getOrDefault(word, 0).
- Use counts.put(word, counts.getOrDefault(word, 0) + 1).
