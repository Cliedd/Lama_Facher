id: java_17_sort
title: Order the scores
language: java
difficulty: Intermediate
chapter: 05 · Text and collections
lesson: Arrays.sort sorts an array in ascending order, changing the original array.
description: Sort the scores and print the middle value.
tip: The middle index of a three-element array is 1.
template: "import java.util.Arrays;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        int[] scores = {9, 2, 5};\n        // TODO: Sort scores.\n        System.out.println(scores[1]);\n\
  \    }\n}\n"
expected_output: '5'
hints:
- Arrays has a sort method.
- Call Arrays.sort(scores) before printing.
