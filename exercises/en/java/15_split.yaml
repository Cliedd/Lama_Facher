id: java_15_split
title: Count comma-separated items
language: java
difficulty: Intermediate
chapter: 05 · Text and collections
lesson: split turns text into an array using a separator; length counts the parts.
description: Print how many languages are in the line.
tip: The separator is a literal comma in this example.
template: "public class Main {\n    public static void main(String[] args) {\n        String\
  \ line = \"Java,Rust,Go\";\n        // TODO: Split the line and count its parts.\n       \
  \ System.out.println(0);\n    }\n}\n"
expected_output: '3'
hints:
- Call line.split(",") to get a String array.
- Print line.split(",").length.
