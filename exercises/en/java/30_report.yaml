id: java_30_report
title: Build a compact report
language: java
difficulty: Intermediate
chapter: 08 · Small programs
lesson: A report often combines filtering, counting, and formatting in one output line.
description: Count values above 10 and print high=<count>.
tip: Calculate the count from the data before formatting.
template: "public class Main {\n    public static void main(String[] args) {\n        int[]\
  \ values = {4, 12, 15, 8, 20};\n        int high = 0;\n        // TODO: Count values above\
  \ 10.\n        System.out.println(\"high=\" + high);\n    }\n}\n"
expected_output: high=3
hints:
- Loop over values and test value > 10.
- Increment high for each matching value.
test_cases:
- name: threshold boundary
  replace: '{4, 12, 15, 8, 20}'
  with: '{10, 11, 12}'
  expected_output: high=2
