id: rust_21_option
title: Use a missing-value fallback
language: rust
difficulty: Intermediate
chapter: 07 · Safe transformations
lesson: Option<T> represents Some(value) or None; unwrap_or supplies a default.
description: Print Guest when the optional name is absent.
tip: Do not unwrap a None value.
template: "fn main() {\n    let name: Option<&str> = None;\n    // TODO: Print a fallback for\
  \ None.\n    println!(\"Replace me\");\n}\n"
expected_output: Guest
hints:
- Call unwrap_or on name.
- Print name.unwrap_or("Guest").
