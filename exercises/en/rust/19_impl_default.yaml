id: rust_19_impl_default
title: Create a default setting
language: rust
difficulty: Intermediate
chapter: 06 · Designing reusable code
lesson: Default provides a sensible initial value for a type.
description: Make Settings::default() provide level 1.
tip: Return a Settings value from the trait method.
template: "struct Settings { level: u8 }\nimpl Default for Settings {\n    fn default() -> Self\
  \ {\n        // TODO: Choose the initial level.\n        Self { level: 0 }\n    }\n}\nfn main()\
  \ {\n    println!(\"{}\", Settings::default().level);\n}\n"
expected_output: '1'
hints:
- Construct Self with the level field.
- 'Set level: 1 in default().'
