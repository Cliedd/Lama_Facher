id: rust_29_gradebook
title: Count passing students
language: rust
difficulty: Intermediate
chapter: 08 · Small programs
lesson: Iterating over map values lets a gradebook count passing scores regardless of names.
description: Print how many students scored at least 50.
tip: The pass threshold is inclusive.
template: "use std::collections::HashMap;\nfn main() {\n    let grades = HashMap::from([(\"\
  Ada\", 80), (\"Lin\", 49), (\"Mia\", 50)]);\n    let mut passed = 0;\n    // TODO: Count grades\
  \ of at least 50.\n    println!(\"{passed}\");\n}\n"
expected_output: '2'
hints:
- Loop through grades.values().
- Increment passed when *score >= 50.
