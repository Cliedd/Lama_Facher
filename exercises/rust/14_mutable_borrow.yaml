id: rust_14_mutable_borrow
title: Modifier une valeur empruntée
language: rust
difficulty: Intermédiaire
chapter: 05 · Textes et collections
lesson: Une référence &mut i32 permet à une fonction de modifier l'entier appartenant au code
  qui l'appelle.
description: Complète add_bonus pour que le score final affiché soit 15.
tip: L'étoile * donne accès à la valeur derrière la référence.
template: "fn add_bonus(score: &mut i32) {\n    // TODO: Add 5 through the mutable reference.\n\
  }\nfn main() {\n    let mut score = 10;\n    add_bonus(&mut score);\n    println!(\"{score}\"\
  );\n}\n"
expected_output: '15'
hints:
- Utilise *score pour accéder à l'entier.
- Dans add_bonus, écris *score += 5;.
