id: rust_15_split
title: Compter les mots d'une phrase
language: rust
difficulty: Intermédiaire
chapter: 05 · Textes et collections
lesson: split_whitespace() sépare une phrase à chaque groupe d'espaces et fournit ses mots un
  par un.
description: Compte les mots de sentence et affiche leur nombre.
tip: count() compte les éléments fournis par l'itérateur.
template: "fn main() {\n    let sentence = \"Rust makes systems fun\";\n    // TODO: Count the\
  \ whitespace-separated words.\n    println!(\"0\");\n}\n"
expected_output: '4'
hints:
- Appelle sentence.split_whitespace().
- Affiche sentence.split_whitespace().count().
