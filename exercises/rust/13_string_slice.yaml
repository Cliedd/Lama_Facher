id: rust_13_string_slice
title: Emprunter un morceau de texte
language: rust
difficulty: Intermédiaire
chapter: 05 · Textes et collections
lesson: Une tranche de texte &str peut désigner une partie d'un String sans la copier.
description: Dans message, récupère seulement « Forge » et affiche ce mot.
tip: 'Ce texte utilise des caractères simples : ses positions en octets correspondent ici aux
  lettres.'
template: "fn main() {\n    let message = String::from(\"Hello, Forge!\");\n    // TODO: Borrow\
  \ just the word Forge.\n    println!(\"{message}\");\n}\n"
expected_output: Forge
hints:
- Le F se trouve après la virgule et l'espace.
- Affiche &message[7..12].
