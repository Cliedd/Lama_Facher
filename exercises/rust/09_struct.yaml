id: rust_09_struct
title: Calculer l'aire d'un rectangle
language: rust
difficulty: Intermédiaire
chapter: 03 · Code et données réutilisables
lesson: Une struct regroupe des données. Un bloc impl lui ajoute des méthodes qui lisent ses
  champs avec &self.
description: Complète Rectangle::area pour renvoyer width multiplié par height.
tip: Le rectangle et l'appel de area sont déjà prêts. Garde les données fournies pour les autres
  vérifications.
template: "struct Rectangle { width: i32, height: i32 }\nimpl Rectangle {\n    fn area(&self)\
  \ -> i32 {\n        // TODO: Compute area.\n        0\n    }\n}\nfn main() {\n    let shape\
  \ = Rectangle { width: 3, height: 4 };\n    println!(\"{}\", shape.area());\n}\n"
expected_output: '12'
hints:
- Lis self.width et self.height.
- Mets self.width * self.height comme dernière expression.
test_cases:
- name: different dimensions
  replace: 'width: 3, height: 4'
  with: 'width: 5, height: 6'
  expected_output: '30'
