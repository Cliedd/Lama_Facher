id: rust_26_sort
title: Trouver le score du milieu
language: rust
difficulty: Intermédiaire
chapter: 08 · Petits programmes
lesson: sort() range un vecteur modifiable du plus petit nombre au plus grand.
description: Trie scores et affiche la valeur du milieu.
tip: Dans un vecteur de cinq éléments, l'indice du milieu est 2.
template: "fn main() {\n    let mut scores = vec![9, 7, 2, 1, 5];\n    // TODO: Sort the vector.\n\
  \    println!(\"{}\", scores[2]);\n}\n"
expected_output: '5'
hints:
- Un Vec possède la méthode sort().
- Appelle scores.sort() avant l'affichage.
