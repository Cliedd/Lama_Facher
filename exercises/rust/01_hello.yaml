id: rust_01_hello
title: Afficher ton premier message
language: rust
difficulty: Débutant
chapter: 01 · Premiers pas
lesson: Un programme Rust commence dans main. println! est une macro qui affiche une ligne.
description: Affiche exactement « Hello, Forge! », avec le point d'exclamation.
tip: Le point d'exclamation fait partie du nom de la macro println!.
template: "fn main() {\n    // TODO: Print the greeting.\n    println!(\"Replace me\");\n}\n"
expected_output: Hello, Forge!
hints:
- Appelle println! avec un texte entre guillemets.
- Place « Hello, Forge! » entre les parenthèses.
