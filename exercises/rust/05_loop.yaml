id: rust_05_loop
title: Additionner une petite suite
language: rust
difficulty: Débutant
chapter: 02 · Décisions et répétitions
lesson: L'intervalle 1..=5 inclut ses deux extrémités. for visite chaque valeur.
description: Additionne les nombres de 1 à 5 et affiche le total.
tip: total a besoin de mut car la boucle le modifie.
template: "fn main() {\n    let mut total = 0;\n    // TODO: Add values in 1..=5.\n    println!(\"\
  {total}\");\n}\n"
expected_output: '15'
hints:
- Utilise for value in 1..=5 { ... }.
- Dans la boucle, écris total += value;.
