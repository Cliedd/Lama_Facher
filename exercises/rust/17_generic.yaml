id: rust_17_generic
title: Lire le premier élément d'une liste
language: rust
difficulty: Intermédiaire
chapter: 06 · Concevoir du code réutilisable
lesson: Une fonction générique utilise un type T pour accepter des listes de différents types.
  &[T] est une tranche empruntée.
description: Complète first pour que le premier nombre affiché soit 7.
tip: 'Renvoie un élément emprunté : la fonction ne doit pas voler la liste.'
template: "fn first<T>(items: &[T]) -> &T {\n    // TODO: Return the first element.\n    &items[1]\n\
  }\nfn main() {\n    let numbers = [7, 8];\n    println!(\"{}\", first(&numbers));\n}\n"
expected_output: '7'
hints:
- Le premier élément se trouve à l'indice 0.
- Renvoie &items[0].
