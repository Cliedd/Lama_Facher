id: rust_16_chars
title: Compter les voyelles
language: rust
difficulty: Intermédiaire
chapter: 05 · Textes et collections
lesson: chars() parcourt les caractères d'un mot. matches! peut vérifier si un caractère correspond
  à plusieurs lettres.
description: Compte les voyelles minuscules du mot banana et affiche le résultat.
tip: 'Le mot est en minuscules : il suffit de chercher a, e, i, o et u.'
template: "fn main() {\n    let word = \"banana\";\n    let mut count = 0;\n    // TODO: Count\
  \ vowels by iterating over chars.\n    println!(\"{count}\");\n}\n"
expected_output: '3'
hints:
- Utilise for ch in word.chars().
- Augmente count si matches!(ch, 'a' | 'e' | 'i' | 'o' | 'u').
