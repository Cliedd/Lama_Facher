id: rust_02_variables
title: Change a score
language: rust
difficulty: Beginner
chapter: 01 · First steps
lesson: Bindings are immutable by default; mut allows changes.
description: Start with score 5, increase it by 7, and print it.
tip: Update score rather than writing a new fixed answer.
template: "fn main() {\n    let mut score = 5;\n    // TODO: Increase score by 7.\n    println!(\"\
  {score}\");\n}\n"
expected_output: '12'
hints:
- A mutable binding can be assigned a new value.
- Use score += 7; before println!.
