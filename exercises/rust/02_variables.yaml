id: rust_02_variables
title: Modifier un score
language: rust
difficulty: Débutant
chapter: 01 · Premiers pas
lesson: En Rust, une variable ne change pas par défaut. Le mot mut autorise les modifications.
description: Commence avec score égal à 5, augmente-le de 7, puis affiche-le.
tip: Modifie score au lieu d'écrire directement la réponse 12.
template: "fn main() {\n    let mut score = 5;\n    // TODO: Increase score by 7.\n    println!(\"\
  {score}\");\n}\n"
expected_output: '12'
hints:
- Une variable mutable peut recevoir une nouvelle valeur.
- Écris score += 7; avant println!.
