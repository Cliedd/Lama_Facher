id: rust_28_inventory
title: Mettre à jour un stock
language: rust
difficulty: Intermédiaire
chapter: 08 · Petits programmes
lesson: Une HashMap garde la quantité de chaque objet. entry() permet de la retrouver ou de
  la créer lors d'une livraison.
description: Traite toutes les livraisons et affiche le stock de pen.
tip: Le même objet peut apparaître plusieurs fois.
template: "use std::collections::HashMap;\nfn main() {\n    let deliveries = [(\"pen\", 2),\
  \ (\"book\", 3), (\"pen\", 4)];\n    let mut stock: HashMap<&str, i32> = HashMap::new();\n\
  \    // TODO: Add each delivery to its item.\n    println!(\"{}\", stock.get(\"pen\").unwrap_or(&0));\n\
  }\n"
expected_output: '6'
hints:
- Parcours deliveries avec for (item, amount) in deliveries.
- Ajoute amount avec *stock.entry(item).or_insert(0) += amount;.
