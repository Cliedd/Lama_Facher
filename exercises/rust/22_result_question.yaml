id: rust_22_result_question
title: Transmettre une erreur de conversion
language: rust
difficulty: Intermédiaire
chapter: 07 · Transformations sûres
lesson: Dans une fonction qui renvoie Result, le symbole ? renvoie une erreur immédiatement
  si une opération échoue.
description: Complète parse_number pour que le texte valide du programme donne 42.
tip: Le type d'erreur de la fonction convient déjà à parse().
template: "fn parse_number(text: &str) -> Result<i32, std::num::ParseIntError> {\n    // TODO:\
  \ Parse text and propagate any error.\n    Ok(0)\n}\nfn main() {\n    println!(\"{}\", parse_number(\"\
  42\").unwrap());\n}\n"
expected_output: '42'
hints:
- Appelle text.parse::<i32>()? dans la fonction.
- Mets le résultat dans value, puis renvoie Ok(value).
