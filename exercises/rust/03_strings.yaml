id: rust_03_strings
title: Formater un message de bienvenue
language: rust
difficulty: Débutant
chapter: 01 · Premiers pas
lesson: println! insère des valeurs grâce aux accolades. String possède son texte.
description: Affiche « Hello, Ada! » avec la variable name.
tip: Place du texte autour de la valeur {name}.
template: "fn main() {\n    let name = String::from(\"Ada\");\n    // TODO: Use name in the\
  \ greeting.\n    println!(\"{name}\");\n}\n"
expected_output: Hello, Ada!
hints:
- Garde {name} dans le texte de formatage.
- Utilise println!("Hello, {name}!");
