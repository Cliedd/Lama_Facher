id: rust_27_average
title: Calculer une moyenne entière
language: rust
difficulty: Intermédiaire
chapter: 08 · Petits programmes
lesson: Pour calculer une moyenne, additionne les scores puis divise par leur nombre. La division
  entière perd les décimales.
description: Calcule la moyenne des scores de scores et affiche-la.
tip: Convertis scores.len() en i32 pour la division. Garde les données fournies pour les autres
  vérifications.
template: "fn main() {\n    let scores = [10, 20, 30];\n    // TODO: Sum scores and divide by\
  \ their count.\n    println!(\"0\");\n}\n"
expected_output: '20'
hints:
- Utilise scores.iter().sum::<i32>().
- Divise la somme par scores.len() as i32.
test_cases:
- name: uneven average
  replace: '[10, 20, 30]'
  with: '[5, 6]'
  expected_output: '5'
