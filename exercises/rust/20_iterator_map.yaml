id: rust_20_iterator_map
title: Doubler une suite de nombres
language: rust
difficulty: Intermédiaire
chapter: 06 · Concevoir du code réutilisable
lesson: Sur un itérateur, map() transforme chaque nombre. sum() additionne ensuite les nombres
  transformés.
description: Double chaque nombre de numbers et affiche leur somme.
tip: Appelle sum() après map() pour obtenir un seul entier.
template: "fn main() {\n    let numbers = [1, 2, 3];\n    // TODO: Map each item to twice its\
  \ value, then sum.\n    println!(\"0\");\n}\n"
expected_output: '12'
hints:
- Commence avec numbers.iter().
- Utilise map(|n| n * 2).sum::<i32>().
