id: rust_04_condition
title: Choose a ticket price
language: rust
difficulty: Beginner
chapter: 02 · Decisions and repetition
lesson: 'if is an expression: its branches can produce a value.'
description: Visitors younger than 18 pay 5; everyone else pays 10. Print the price for age
  16.
tip: Both branches must have compatible types.
template: "fn main() {\n    let age = 16;\n    // TODO: Replace the placeholder with an if expression.\n\
  \    let price = 0;\n    println!(\"{price}\");\n}\n"
expected_output: '5'
hints:
- Compare age < 18.
- Use let price = if age < 18 { 5 } else { 10 };
