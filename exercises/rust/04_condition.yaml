id: rust_04_condition
title: Choisir un prix de billet
language: rust
difficulty: Débutant
chapter: 02 · Décisions et répétitions
lesson: 'if est une expression : ses branches peuvent produire une valeur.'
description: Les visiteurs de moins de 18 ans paient 5 ; les autres paient 10. Affiche le prix
  pour l'âge 16.
tip: Les deux branches doivent produire le même type.
template: "fn main() {\n    let age = 16;\n    // TODO: Replace the placeholder with an if expression.\n\
  \    let price = 0;\n    println!(\"{price}\");\n}\n"
expected_output: '5'
hints:
- Compare age < 18.
- Utilise let price = if age < 18 { 5 } else { 10 } ;
test_cases:
- name: below boundary
  replace: let age = 16;
  with: let age = 17;
  expected_output: '5'
- name: boundary age
  replace: let age = 16;
  with: let age = 18;
  expected_output: '10'
- name: above boundary
  replace: let age = 16;
  with: let age = 42;
  expected_output: '10'
