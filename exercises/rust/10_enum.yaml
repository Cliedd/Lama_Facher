id: rust_10_enum
title: Réagir à chaque état
language: rust
difficulty: Intermédiaire
chapter: 04 · Cas concrets
lesson: Un enum énumère plusieurs états possibles. match choisit une action pour chacun d'eux.
description: Affiche ready pour Status::Ready et busy pour Status::Busy.
tip: Un match doit traiter tous les états de Status.
template: "enum Status { Ready, Busy }\nfn main() {\n    let status = Status::Ready;\n    //\
  \ TODO: Match status and print the matching text.\n    println!(\"unknown\");\n}\n"
expected_output: ready
hints:
- Utilise match status avec deux branches.
- Appelle println!("ready") pour Ready et println!("busy") pour Busy.
