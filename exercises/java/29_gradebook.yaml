id: java_29_gradebook
title: Compter les élèves qui réussissent
language: java
difficulty: Intermédiaire
chapter: 08 · Petits programmes
lesson: La map grades associe un nom à un score. Ici, seul le score compte pour vérifier la
  réussite.
description: Affiche combien d'élèves ont un score d'au moins 50.
tip: La note 50 compte aussi comme une réussite.
template: "import java.util.Map;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        Map<String, Integer> grades = Map.of(\"Ada\", 80, \"Lin\", 49, \"Mia\"\
  , 50);\n        int passed = 0;\n        // TODO: Count scores of at least 50.\n        System.out.println(passed);\n\
  \    }\n}\n"
expected_output: '2'
hints:
- Parcours grades.values().
- Augmente passed lorsque score >= 50.
