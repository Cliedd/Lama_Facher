id: java_27_average
title: Calculer une moyenne entière
language: java
difficulty: Intermédiaire
chapter: 08 · Petits programmes
lesson: Une moyenne se calcule en divisant la somme des scores par leur nombre. Avec des int,
  la partie décimale est perdue.
description: Calcule la moyenne des scores du tableau et affiche-la.
tip: Utilise scores.length pour connaître le nombre de scores. Garde les données fournies pour
  les autres vérifications.
template: "public class Main {\n    public static void main(String[] args) {\n        int[]\
  \ scores = {10, 20, 30};\n        int total = 0;\n        // TODO: Add all scores and divide\
  \ by their count.\n        System.out.println(total);\n    }\n}\n"
expected_output: '20'
hints:
- Parcours scores pour obtenir total.
- Affiche total / scores.length.
test_cases:
- name: uneven average
  replace: '{10, 20, 30}'
  with: '{5, 6}'
  expected_output: '5'
