id: java_28_inventory
title: Mettre à jour un stock
language: java
difficulty: Intermédiaire
chapter: 08 · Petits programmes
lesson: Une HashMap peut garder la quantité en stock pour chaque objet. Une livraison augmente
  cette quantité.
description: Additionne les livraisons de items et amounts, puis affiche le stock de pen.
tip: Le même objet peut apparaître plusieurs fois.
template: "import java.util.HashMap;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        String[] items = {\"pen\", \"book\", \"pen\"};\n        int[] amounts =\
  \ {2, 3, 4};\n        HashMap<String, Integer> stock = new HashMap<>();\n        // TODO:\
  \ Add each amount to its item.\n        System.out.println(stock.getOrDefault(\"pen\", 0));\n\
  \    }\n}\n"
expected_output: '6'
hints:
- Utilise le même indice dans items et amounts.
- Utilise stock.put(items[i], stock.getOrDefault(items[i], 0) + amounts[i]).
