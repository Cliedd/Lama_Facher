id: java_19_constructor
title: Initialiser un compte
language: java
difficulty: Intermédiaire
chapter: 06 · Concevoir du code réutilisable
lesson: Le constructeur prépare un nouvel objet. Ici, il reçoit le solde de départ dans initial.
description: Enregistre initial dans le champ balance pour que balance() affiche 25.
tip: this.balance désigne le champ de l'objet.
template: "public class Main {\n    public static void main(String[] args) {\n        Account\
  \ account = new Account(25);\n        System.out.println(account.balance());\n    }\n}\nclass\
  \ Account {\n    private int balance;\n    Account(int initial) {\n        // TODO: Save initial\
  \ in the field.\n    }\n    int balance() { return balance; }\n}\n"
expected_output: '25'
hints:
- Dans le constructeur, affecte le paramètre au champ.
- Écris this.balance = initial;.
