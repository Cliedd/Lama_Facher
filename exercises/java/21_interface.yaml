id: java_21_interface
title: Appliquer une règle aux nombres
language: java
difficulty: Intermédiaire
chapter: 06 · Concevoir du code réutilisable
lesson: Une interface annonce une méthode à fournir. Ici, EvenRule doit décider si un nombre
  est pair.
description: Complète accept(value) pour que le programme affiche true pour 8 et accepte les
  nombres pairs.
tip: L'opérateur % donne le reste d'une division.
template: "public class Main {\n    public static void main(String[] args) {\n        Rule rule\
  \ = new EvenRule();\n        System.out.println(rule.accept(8));\n    }\n}\ninterface Rule\
  \ { boolean accept(int value); }\nclass EvenRule implements Rule {\n    public boolean accept(int\
  \ value) {\n        // TODO: Accept even numbers only.\n        return false;\n    }\n}\n"
expected_output: 'true'
hints:
- Un nombre pair laisse un reste de 0 quand on le divise par 2.
- Renvoie value % 2 == 0;.
