id: java_14_trim
title: Nettoyer un texte saisi
language: java
difficulty: Intermédiaire
chapter: 05 · Textes et collections
lesson: trim() enlève les espaces au début et à la fin. toLowerCase() met les lettres en minuscules.
description: Nettoie input et affiche son contenu en minuscules.
tip: Enchaîne les deux méthodes sur input ; ne remplace pas la donnée à la main.
template: "public class Main {\n    public static void main(String[] args) {\n        String\
  \ input = \"  RuSt  \";\n        // TODO: Trim whitespace and lowercase the text.\n      \
  \  System.out.println(input);\n    }\n}\n"
expected_output: rust
hints:
- Appelle d'abord trim().
- Affiche input.trim().toLowerCase().
