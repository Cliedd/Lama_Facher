id: java_23_stream_filter
title: Compter les nombres pairs
language: java
difficulty: Intermédiaire
chapter: 07 · Transformations sûres
lesson: Un stream parcourt des données. filter() ne garde que les valeurs qui respectent une
  règle, puis count() les compte.
description: Compte les nombres pairs de numbers et affiche le résultat.
tip: La règle d'un nombre pair est n % 2 == 0.
template: "import java.util.Arrays;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        int[] numbers = {1, 2, 3, 4, 6};\n        // TODO: Filter even numbers\
  \ in the stream.\n        System.out.println(0);\n    }\n}\n"
expected_output: '3'
hints:
- Commence avec Arrays.stream(numbers).
- Ajoute filter(n -> n % 2 == 0).count().
