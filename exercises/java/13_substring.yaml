id: java_13_substring
title: Extraire un mot d'un texte
language: java
difficulty: Intermédiaire
chapter: 05 · Textes et collections
lesson: substring(début, fin) prend les caractères depuis début jusqu'avant fin. Le premier
  caractère a l'indice 0.
description: Dans label, récupère seulement « Forge » et affiche ce mot.
tip: Dans « Hello, Forge! », le F est à l'indice 7.
template: "public class Main {\n    public static void main(String[] args) {\n        String\
  \ label = \"Hello, Forge!\";\n        // TODO: Extract Forge with substring.\n        System.out.println(label);\n\
  \    }\n}\n"
expected_output: Forge
hints:
- Repère le F et la position juste après le e.
- Utilise label.substring(7, 12).
