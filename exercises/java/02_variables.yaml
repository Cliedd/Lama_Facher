id: java_02_variables
title: Additionner deux scores
language: java
difficulty: Débutant
chapter: 01 · Premiers pas
lesson: Un int stocke un nombre entier. Une expression peut combiner plusieurs variables.
description: Affiche la somme de first et de second.
tip: Calcule le résultat avec les variables au lieu d'écrire directement 20.
template: "public class Main {\n    public static void main(String[] args) {\n        int first\
  \ = 12;\n        int second = 8;\n        // TODO: Print their sum.\n        System.out.println(first);\n\
  \    }\n}\n"
expected_output: '20'
hints:
- Utilise l'opérateur +.
- Donne first + second à System.out.println.
test_cases:
- name: different values
  replace: int first = 12;
  with: int first = -4;
  expected_output: '4'
