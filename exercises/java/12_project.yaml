id: java_12_project
title: Calculer un panier
language: java
difficulty: Intermédiaire
chapter: 04 · Cas concrets
lesson: 'Ce petit programme réunit tableau, boucle et condition : on additionne, puis on applique
  une réduction.'
description: Additionne les prix {3, 7, 2}. Si le total dépasse 10, retire 2. Affiche le résultat.
tip: Calcule à partir de prices au lieu d'écrire 10 directement. Garde les données fournies
  pour les autres vérifications.
template: "public class Main {\n    public static void main(String[] args) {\n        int[]\
  \ prices = {3, 7, 2};\n        int total = 0;\n        // TODO: Sum prices and apply the discount.\n\
  \        System.out.println(total);\n    }\n}\n"
expected_output: '10'
hints:
- Parcours prices et ajoute chaque prix à total.
- Après la boucle, si total > 10, retire 2.
test_cases:
- name: no discount
  replace: '{3, 7, 2}'
  with: '{3, 4, 2}'
  expected_output: '9'
