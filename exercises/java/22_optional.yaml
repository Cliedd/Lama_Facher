id: java_22_optional
title: Prévoir un nom de secours
language: java
difficulty: Intermédiaire
chapter: 07 · Transformations sûres
lesson: Optional peut contenir un nom ou être vide. orElse() donne un texte de secours s'il
  est vide.
description: Quand name est vide, affiche exactement « Guest ».
tip: N'appelle pas get() sur un Optional vide.
template: "import java.util.Optional;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        Optional<String> name = Optional.empty();\n        // TODO: Print the fallback\
  \ name.\n        System.out.println(\"Replace me\");\n    }\n}\n"
expected_output: Guest
hints:
- Appelle orElse() sur name.
- Affiche name.orElse("Guest").
