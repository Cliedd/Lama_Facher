id: java_16_set
title: Compter les visiteurs différents
language: java
difficulty: Intermédiaire
chapter: 05 · Textes et collections
lesson: Un HashSet garde chaque nom une seule fois, même si on l'ajoute plusieurs fois.
description: Ajoute tous les noms de visitors à unique, puis affiche combien de noms différents
  il contient.
tip: size() augmente seulement lorsque le nom ajouté est nouveau.
template: "import java.util.HashSet;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        String[] visitors = {\"Ada\", \"Lin\", \"Ada\", \"Mia\"};\n        HashSet<String>\
  \ unique = new HashSet<>();\n        // TODO: Add every visitor to unique.\n        System.out.println(unique.size());\n\
  \    }\n}\n"
expected_output: '3'
hints:
- Parcours le tableau visitors.
- Dans la boucle, appelle unique.add(visitor).
