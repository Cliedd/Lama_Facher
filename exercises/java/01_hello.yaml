id: java_01_hello
title: Afficher ton premier message
language: java
difficulty: Débutant
chapter: 01 · Premiers pas
lesson: Un programme Java commence dans main. System.out.println affiche une ligne à l'écran.
description: Affiche exactement « Hello, Forge! », avec le point d'exclamation.
tip: 'Garde le nom de classe Main : Forge utilise le fichier Main.java.'
template: "public class Main {\n    public static void main(String[] args) {\n        // TODO:\
  \ Print the greeting.\n        System.out.println(\"Replace me\");\n    }\n}\n"
expected_output: Hello, Forge!
hints:
- Utilise System.out.println avec un texte entre guillemets.
- Place « Hello, Forge! » entre les parenthèses.
