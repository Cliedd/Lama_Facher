id: java_10_map
title: Compter les mots
language: java
difficulty: Intermédiaire
chapter: 04 · Cas concrets
lesson: Une HashMap associe une clé à une valeur. getOrDefault donne 0 si le mot n'a pas encore
  été vu.
description: Compte chaque mot du tableau, puis affiche le nombre de fois où rust apparaît.
tip: Utilise chaque mot comme clé de la map.
template: "import java.util.HashMap;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        String[] words = {\"java\", \"rust\", \"rust\", \"java\", \"rust\"};\n\
  \        HashMap<String, Integer> counts = new HashMap<>();\n        // TODO: Count every\
  \ word.\n        System.out.println(counts.getOrDefault(\"rust\", 0));\n    }\n}\n"
expected_output: '3'
hints:
- Parcours words et lis counts.getOrDefault(word, 0).
- Mets à jour avec counts.put(word, counts.getOrDefault(word, 0) + 1).
