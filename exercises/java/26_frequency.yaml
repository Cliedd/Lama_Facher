id: java_26_frequency
title: Compter les fruits
language: java
difficulty: Intermédiaire
chapter: 08 · Petits programmes
lesson: Une table de fréquences associe chaque fruit à son nombre d'apparitions.
description: Compte les fruits du tableau et affiche combien de fois apple apparaît.
tip: getOrDefault(fruit, 0) renvoie 0 avant le premier fruit. Garde les données fournies pour
  les autres vérifications.
template: "import java.util.HashMap;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        String[] fruits = {\"apple\", \"pear\", \"apple\", \"plum\", \"apple\"\
  };\n        HashMap<String, Integer> counts = new HashMap<>();\n        // TODO: Count each\
  \ fruit.\n        System.out.println(counts.getOrDefault(\"apple\", 0));\n    }\n}\n"
expected_output: '3'
hints:
- Parcours fruits en prenant chaque fruit comme clé.
- Utilise counts.put(fruit, counts.getOrDefault(fruit, 0) + 1).
test_cases:
- name: missing apple
  replace: '{"apple", "pear", "apple", "plum", "apple"}'
  with: '{"pear", "plum"}'
  expected_output: '0'
