id: java_04_condition
title: Choisir un prix de billet
language: java
difficulty: Débutant
chapter: 02 · Décisions et répétitions
lesson: if/else choisit un chemin. L'opérateur < compare deux nombres.
description: Les visiteurs de moins de 18 ans paient 5 ; les autres paient 10. Affiche le prix
  pour l'âge 16.
tip: Teste ensuite l'âge limite 18.
template: "public class Main {\n    public static void main(String[] args) {\n        int age\
  \ = 16;\n        int price = 0;\n        // TODO: Set price with if/else.\n        System.out.println(price);\n\
  \    }\n}\n"
expected_output: '5'
hints:
- Compare age et 18 avec <.
- Mets 5 dans la branche if et 10 dans la branche else.
test_cases:
- name: below boundary
  replace: int age = 16;
  with: int age = 17;
  expected_output: '5'
- name: boundary age
  replace: int age = 16;
  with: int age = 18;
  expected_output: '10'
- name: above boundary
  replace: int age = 16;
  with: int age = 42;
  expected_output: '10'
