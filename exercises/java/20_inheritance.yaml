id: java_20_inheritance
title: Personnaliser un message hérité
language: java
difficulty: Intermédiaire
chapter: 06 · Concevoir du code réutilisable
lesson: Une classe enfant peut remplacer une méthode de sa classe parent en gardant le même
  nom et le même type de retour.
description: Dans Friendly, remplace message() pour qu'elle renvoie « Hello, Ada! ».
tip: Garde la même signature que dans Greeting.
template: "public class Main {\n    public static void main(String[] args) {\n        Greeting\
  \ greeting = new Friendly();\n        System.out.println(greeting.message());\n    }\n}\n\
  class Greeting { String message() { return \"Hello\"; } }\nclass Friendly extends Greeting\
  \ {\n    // TODO: Override message() to add Ada.\n}\n"
expected_output: Hello, Ada!
hints:
- Déclare String message() dans Friendly.
- Renvoie "Hello, Ada!" depuis cette méthode.
