id: java_09_list
title: Garder les scores suffisants
language: java
difficulty: Intermédiaire
chapter: 03 · Code et données réutilisables
lesson: Une ArrayList est une liste qui peut grandir. size() donne le nombre d'éléments.
description: Ajoute à passing les scores d'au moins 50, puis affiche combien il y en a.
tip: Le tableau scores et la liste passing sont déjà créés.
template: "import java.util.ArrayList;\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        int[] scores = {42, 80, 55, 31};\n        ArrayList<Integer> passing =\
  \ new ArrayList<>();\n        // TODO: Add each passing score.\n        System.out.println(passing.size());\n\
  \    }\n}\n"
expected_output: '2'
hints:
- Parcours scores et compare chaque score à 50.
- Quand score >= 50, appelle passing.add(score).
