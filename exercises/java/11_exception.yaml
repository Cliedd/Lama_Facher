id: java_11_exception
title: Gérer une saisie invalide
language: java
difficulty: Intermédiaire
chapter: 04 · Cas concrets
lesson: Integer.parseInt transforme un texte en entier. Si le texte n'est pas un nombre, une
  NumberFormatException se produit.
description: Essaie de convertir input. Si la conversion échoue, affiche exactement « invalid
  » sans arrêter le programme.
tip: Intercepte NumberFormatException dans un bloc catch.
template: "public class Main {\n    public static void main(String[] args) {\n        String\
  \ input = \"twelve\";\n        // TODO: Parse in a try block and handle the error.\n     \
  \   System.out.println(\"Replace me\");\n    }\n}\n"
expected_output: invalid
hints:
- Place Integer.parseInt(input) dans un bloc try.
- Dans catch (NumberFormatException e), affiche "invalid".
